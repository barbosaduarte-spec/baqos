<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo: Adivinhe o Número</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e24;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .game-container {
      background-color: #2a2b36;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 300px;
      width: 100%;
    }
    input {
      padding: 10px;
      font-size: 16px;
      width: 80%;
      margin-bottom: 10px;
      border-radius: 5px;
      border: none;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    #mensagem {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h2>Adivinhe o Número</h2>
    <p>Tente adivinhar o número entre <strong>1 e 50</strong>:</p>
    <input type="number" id="palpite" min="1" max="50" placeholder="Digite seu número">
    <br>
    <button onclick="verificarPalpite()">Chutar</button>
    <p id="mensagem"></p>
  </div>

  <script>
    // Gera um número aleatório entre 1 e 50
    const numeroAleatorio = Math.floor(Math.random() * 50) + 1;
    let tentativas = 0;

    function verificarPalpite() {
      const palpiteInput = document.getElementById('palpite');
      const palpite = Number(palpiteInput.value);
      const mensagem = document.getElementById('mensagem');

      if (!palpite || palpite < 1 || palpite > 50) {
        mensagem.style.color = '#ff4d4d';
        mensagem.textContent = 'Por favor, digite um número válido entre 1 e 50!';
        return;
      }

      tentativas++;

      if (palpite === numeroAleatorio) {
        mensagem.style.color = '#4CAF50';
        mensagem.textContent = `Parabéns! Você acertou o número ${numeroAleatorio} em ${tentativas} tentativa(s)!`;
      } else if (palpite < numeroAleatorio) {
        mensagem.style.color = '#ffcc00';
        mensagem.textContent = 'Muito baixo! Tente um número maior.';
      } else {
        mensagem.style.color = '#ffcc00';
        mensagem.textContent = 'Muito alto! Tente um número menor.';
      }

      palpiteInput.value = '';
      palpiteInput.focus();
    }
  </script>

</body>
</html>
